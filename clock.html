<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Global Time Zone Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap');
        
        :root {
            --ink: #e9ece6;
            --muted: #9aa39b;
            --paper: #111613;
            --paper2: #181d1a;
            --olive: #687567;
            --moss: #56645a;
            --rust: #a97862;
            --line: #4d5750;
            --white: #e9ece6;
            --dark: #0b0e0d;
            --grid: rgba(225, 232, 224, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: Manrope, Arial, sans-serif;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        body:before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.16;
            background-image: radial-gradient(#222 0.5px, transparent 0.5px);
            background-size: 8px 8px;
            z-index: 100;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 80;
            height: 62px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 28px;
            background: rgba(17, 22, 19, 0.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        .logo {
            font: 500 13px "DM Mono", monospace;
            cursor: pointer;
        }

        .logo:hover {
            color: var(--rust);
        }

        .navlinks {
            display: flex;
            gap: 24px;
            font: 400 10px "DM Mono", monospace;
            text-transform: uppercase;
        }

        .navlinks a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .navlinks a:hover {
            color: var(--rust);
        }

        .header {
            text-align: center;
            margin: 100px 0 60px;
        }

        .header h1 {
            font-family: "Libre Baskerville", serif;
            font-size: 64px;
            line-height: 1.2;
            margin: 0 0 20px;
            letter-spacing: -0.075em;
        }

        .header p {
            font-size: 18px;
            color: var(--muted);
            margin: 0;
        }

        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 60px;
        }

        .timezone-card {
            border: 1px solid var(--line);
            background: linear-gradient(145deg, #1b211e, #151a17);
            padding: 30px;
            cursor: pointer;
            transition: 0.45s;
            position: relative;
            overflow: hidden;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .timezone-card:before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 8px;
            background: var(--moss);
            opacity: 0.8;
        }

        .timezone-card:hover {
            transform: translateY(-9px);
            box-shadow: 12px 14px 0 rgba(63, 75, 66, 0.12);
        }

        .timezone-name {
            font: 500 12px "DM Mono", monospace;
            text-transform: uppercase;
            color: var(--moss);
            letter-spacing: 0.16em;
            margin-bottom: 15px;
        }

        .city-name {
            font-family: "Libre Baskerville", serif;
            font-size: 28px;
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: -0.05em;
        }

        .time-display {
            font-family: "DM Mono", monospace;
            font-size: 42px;
            font-weight: 500;
            color: var(--rust);
            letter-spacing: 0.07em;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .time-period {
            font-family: "DM Mono", monospace;
            font-size: 11px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .date-display {
            font-family: "DM Mono", monospace;
            font-size: 10px;
            color: var(--muted);
            margin-top: 15px;
            line-height: 1.5;
        }

        .offset {
            font-family: "DM Mono", monospace;
            font-size: 9px;
            color: var(--olive);
            margin-top: 8px;
            letter-spacing: 0.08em;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border: 1px solid var(--line);
            background: rgba(24, 29, 26, 0.68);
            color: var(--ink);
            font-family: "DM Mono", monospace;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: 0.3s;
        }

        .btn:hover {
            background: var(--rust);
            color: var(--dark);
            border-color: var(--rust);
        }

        .btn.active {
            background: var(--rust);
            color: var(--dark);
            border-color: var(--rust);
        }

        footer {
            padding: 28px 0;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            font: 9px "DM Mono", monospace;
            margin-top: 60px;
        }

        @media (max-width: 850px) {
            .header h1 {
                font-size: 42px;
            }

            .clock-grid {
                grid-template-columns: 1fr;
            }

            nav {
                padding: 0 18px;
            }

            .navlinks {
                display: none;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="index.html">RE-SEARCH LAB / CLOCK</a>
        <div class="navlinks">
            <a href="index.html">Portfolio</a>
            <a href="clock.html">Global Clock</a>
            <a href="todo.html">Tasks</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>GLOBAL TIME ZONES</h1>
            <p>Real-time clock across major research and policy hubs</p>
        </div>

        <div class="controls">
            <button class="btn active" onclick="showFormat('24h')">24-HOUR</button>
            <button class="btn" onclick="showFormat('12h')">12-HOUR</button>
            <button class="btn" onclick="refreshClocks()">REFRESH</button>
        </div>

        <div class="clock-grid" id="clockGrid"></div>

        <footer>
            <span>RE-SEARCH LAB / GLOBAL CLOCK</span>
            <span>TIME ZONES · RESEARCH HUBS</span>
        </footer>
    </div>

    <script>
        const timezones = [
            { city: 'New York', tz: 'America/New_York', offset: 'UTC-5/-4' },
            { city: 'London', tz: 'Europe/London', offset: 'UTC+0/+1' },
            { city: 'Tokyo', tz: 'Asia/Tokyo', offset: 'UTC+9' },
            { city: 'Sydney', tz: 'Australia/Sydney', offset: 'UTC+10/+11' },
            { city: 'Dubai', tz: 'Asia/Dubai', offset: 'UTC+4' },
            { city: 'Singapore', tz: 'Asia/Singapore', offset: 'UTC+8' },
            { city: 'Hong Kong', tz: 'Asia/Hong_Kong', offset: 'UTC+8' },
            { city: 'Mumbai', tz: 'Asia/Kolkata', offset: 'UTC+5:30' },
            { city: 'Berlin', tz: 'Europe/Berlin', offset: 'UTC+1/+2' },
            { city: 'Toronto', tz: 'America/Toronto', offset: 'UTC-5/-4' },
            { city: 'São Paulo', tz: 'America/Sao_Paulo', offset: 'UTC-3/-2' },
            { city: 'Los Angeles', tz: 'America/Los_Angeles', offset: 'UTC-8/-7' }
        ];

        let currentFormat = '24h';

        function updateClock() {
            const grid = document.getElementById('clockGrid');
            grid.innerHTML = '';

            timezones.forEach(tz => {
                const time = new Date().toLocaleString('en-US', {
                    timeZone: tz.tz,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });

                const [datePart, timePart] = time.split(', ');
                const [hours, minutes, seconds] = timePart.split(':');

                let displayTime, period = '';
                if (currentFormat === '12h') {
                    const h = parseInt(hours);
                    period = h >= 12 ? 'PM' : 'AM';
                    displayTime = `${String(h % 12 || 12).padStart(2, '0')}:${minutes}:${seconds}`;
                } else {
                    displayTime = `${hours}:${minutes}:${seconds}`;
                }

                const card = document.createElement('div');
                card.className = 'timezone-card';
                card.innerHTML = `
                    <div class="timezone-name">${tz.tz.split('/')[1]?.replace(/_/g, ' ') || tz.tz}</div>
                    <div class="city-name">${tz.city}</div>
                    <div class="time-display">${displayTime}</div>
                    ${period ? `<div class="time-period">${period}</div>` : ''}
                    <div class="date-display">${datePart}</div>
                    <div class="offset">${tz.offset}</div>
                `;
                grid.appendChild(card);
            });
        }

        function showFormat(format) {
            currentFormat = format;
            document.querySelectorAll('.controls .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateClock();
        }

        function refreshClocks() {
            updateClock();
        }

        // Update clock every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
